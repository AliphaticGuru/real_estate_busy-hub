name: Deploy

# Deployment entry point. Disabled by default (dry run) and manually triggered;
# enabling the automatic trigger is a decision for Stage 2c, once the first
# server exists. See README.md → "Deployment" for the full flow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and push the production images without deploying to a server"
        required: false
        default: true
        type: boolean
      sha:
        description: "Commit SHA to build and deploy (defaults to the commit of this dispatch)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  deploy:
    name: Build and deploy production images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve commit SHA
        id: sha
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate deploy SHA
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          VALID_SHA='^[0-9a-f]{40}$'
          if ! printf '%s' "$SHA" | grep -Eq "$VALID_SHA"; then
            echo "::error::refusing to continue: deploy SHA must be a 40 character hex commit SHA, got: ${SHA}"
            exit 1
          fi
          bad_sha_rejected() {
            if printf '%s' "$1" | grep -Eq "$VALID_SHA"; then
              echo "::error::validator accepted a bad SHA: $1" >&2
              return 1
            fi
            return 0
          }
          if bad_sha_rejected "deadbeefdeadbeefdeadbeefdeadbeefdeadbeef"; then
            exit 1
          fi
          if bad_sha_rejected "abc123"; then
            exit 1
          fi
          echo "SHA validated: $SHA"

      - name: Build and push app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/app:${{ steps.sha.outputs.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/app:latest

      - name: Build and push caddy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: caddy
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/caddy:${{ steps.sha.outputs.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/caddy:latest

      - name: Verify deploy SHA is reachable from origin/main and CI passed
        if: ${{ inputs.dry_run != true }}
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$SHA" != "$MAIN_SHA" ]; then
            echo "::error::deploy SHA ${SHA} is not the head of origin/main (${MAIN_SHA}); refusing to deploy"
            exit 1
          fi
          CHECKS_JSON="$(gh api "repos/${REPOSITORY}/commits/${SHA}/check-runs" --jq '.check_runs')"
          FAILED_COUNT="$(printf '%s' "$CHECKS_JSON" | jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length')"
          SUCCEEDED_COUNT="$(printf '%s' "$CHECKS_JSON" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "::error::deploy blocked: a CI check for ${SHA} concluded with a failure"
            exit 1
          fi
          if [ "$SUCCEEDED_COUNT" -eq 0 ]; then
            echo "::error::deploy blocked: no successful CI check run found for ${SHA}"
            exit 1
          fi

      - name: Deploy over SSH to production
        if: ${{ inputs.dry_run != true }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PROD_SSH_HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
          PROD_SERVER_IP: ${{ secrets.PROD_SERVER_IP }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_DIR: /var/www/busy-hub
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          chmod 600 "$KEY_FILE"
          printf '%s' "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          KNOWN_HOSTS_FILE="$(mktemp)"
          printf '%s\n' "$PROD_SSH_HOST_KEY" > "$KNOWN_HOSTS_FILE"
          cleanup() {
            rm -f "$KEY_FILE" "$KNOWN_HOSTS_FILE"
          }
          trap cleanup EXIT
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o IdentitiesOnly=yes -i "$KEY_FILE" -p "${DEPLOY_SSH_PORT:-22}" \
            "${DEPLOY_SSH_USER}@${PROD_SERVER_IP}" \
            "bash ${DEPLOY_DIR}/scripts/deploy.sh ${SHA}"
          cleanup
          trap - EXIT
