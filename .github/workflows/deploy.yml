name: Deploy

# Deployment entry point. Disabled by default (dry run) and manually triggered;
# enabling the automatic trigger is a decision for Stage 2c, once the first
# server exists. See README.md → "Deployment" for the full flow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and push the production images without deploying to a server"
        required: false
        default: true
        type: boolean
      sha:
        description: "Commit SHA to build and deploy (defaults to the commit of this dispatch)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  deploy:
    name: Build and deploy production images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve commit SHA
        id: sha
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/app:${{ steps.sha.outputs.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/app:latest

      - name: Build and push caddy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: caddy
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/caddy:${{ steps.sha.outputs.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/caddy:latest

      - name: Deploy over SSH to production
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i "${{ secrets.DEPLOY_SSH_KEY }}" \
            deploy@${{ secrets.PROD_SERVER_IP }} \
            "bash /var/www/busy-hub/scripts/deploy.sh ${{ steps.sha.outputs.sha }}"
        env:
          APP_ENV: production
