services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: busy-hub-app
    working_dir: /var/www/html
    # Dev only: the built image runs PHP-FPM (production). Locally we serve the
    # app over HTTP with the built-in server so /up can be health-checked.
    command: php artisan serve --host=0.0.0.0 --port=8000
    # Match the host user so the bind-mounted storage/ and bootstrap/cache are writable
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=busy_hub
      - DB_USERNAME=busyhub
      - DB_PASSWORD=secret
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: busy-hub-queue
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --max-time=3600
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=busy_hub
      - DB_USERNAME=busyhub
      - DB_PASSWORD=secret
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: busy-hub-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - .:/var/www/html
      - caddy_data:/data
      - caddy_config:/config

  db:
    image: postgres:15-alpine
    container_name: busy-hub-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=busy_hub
      - POSTGRES_USER=busyhub
      - POSTGRES_PASSWORD=secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busyhub -d busy_hub"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
