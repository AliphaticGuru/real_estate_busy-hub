[www]
user = www-data
group = www-data

; Caddy reaches the app container over the Docker network.
listen = 0.0.0.0:9000
; Do not set listen.allowed_clients. An empty value parses as an empty
; allow-list and FPM drops every FastCGI connection ("There are no allowed
; addresses"). The app container publishes no ports, so the Docker network is
; the boundary instead.

; Resource-friendly defaults for a 2 GB VPS: 6 workers x ~24-32 MB each,
; leaving headroom for Postgres, Caddy and the queue worker. Tune after
; measuring real traffic with `php artisan horizon` metrics or `ps`.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Laravel needs the container environment available to FPM workers.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
